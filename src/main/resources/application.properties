# ==============================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================
spring.config.import=optional:file:.env.local[.properties]
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.forward-headers-strategy=framework

# ==============================
# CONEXIÓN A MONGODB
# ==============================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=bienesraices
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.gridfs.bucket=imagenesPropiedades

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:chat-disabled}
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# ==============================
# LÍMITES DE SUBIDA DE ARCHIVOS
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
server.tomcat.max-swallow-size=40MB

# ==============================
# CONFIGURACIÓN GENERAL
# ==============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
